<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>予定を画像にする｜墓場文庫 最新情報ポータル</title>
<meta name="description" content="墓場文庫の最新情報ポータルから気になる予定をえらぶと、X などに投稿できる画像になります。">
<meta property="og:type" content="website">
<meta property="og:site_name" content="墓場文庫｜最新情報ポータル">
<meta property="og:title" content="予定を画像にする｜墓場文庫 最新情報ポータル">
<meta property="og:description" content="気になる予定をえらぶと、X などに投稿できる画像になります。">
<meta property="og:url" content="https://info.hakaba-bunko.net/share.html">
<meta property="og:image" content="https://info.hakaba-bunko.net/ogp.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="予定を画像にする｜墓場文庫 最新情報ポータル">
<meta name="twitter:description" content="気になる予定をえらぶと、X などに投稿できる画像になります。">
<meta name="twitter:image" content="https://info.hakaba-bunko.net/ogp.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900&display=swap" rel="stylesheet" crossorigin="anonymous">
<style>
  :root{
    --frame:#bcd7e6;
    --ink:#22394a;
    --ink2:#4d6b7d;
    --line:#dce8ef;
    --accent:#2e7fae;
    --today:#f5a623;
    --today-bg:#fff8e8;
    --sun:#d64545;
    --sat:#2f7fc4;
  }
  .ty-goods{--c:#d98a00}
  .ty-books{--c:#2f6fde}
  .ty-events{--c:#15803d}
  .ty-web{--c:#dc2626}
  .ty-news{--c:#0f766e}
  .ty-sale{--c:#c2410c}

  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:#eef5f9;color:var(--ink);font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;font-size:14px;line-height:1.6}
  button,input{font:inherit;color:inherit}

  /* ===== 操作画面（やさしいトーン。境界線は薄く、面の色の違いで区切る） ===== */
  .app{display:flex;height:100vh}
  .side{flex:none;width:460px;height:100%;overflow-y:auto;padding:28px 28px 40px;background:#fffdf9}
  .main{flex:1;min-width:0;overflow:auto;padding:32px}
  .back{display:inline-block;color:var(--accent);font-size:14px;font-weight:700;text-decoration:none}
  .back:hover{text-decoration:underline}
  .side h1{margin:16px 0 0;font-size:24px;font-weight:900;line-height:1.4}
  .lead{margin:8px 0 0;color:var(--ink2);font-size:14px;line-height:1.8}
  .edit-badge{margin:12px 0 0;padding:8px 12px;border-radius:10px;background:var(--today-bg);font-size:13px;line-height:1.6}
  .step{margin-top:32px}
  .q{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:17px;font-weight:700;line-height:1.5}
  .num{flex:none;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:#e1eef6;color:var(--accent);font-family:"Outfit",sans-serif;font-size:14px;font-weight:700}

  /* 1. 画像の形（見本の絵つきのカード） */
  .kinds{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
  .kind{display:flex;flex-direction:column;align-items:center;gap:6px;min-height:132px;padding:12px 8px;border:2px solid transparent;border-radius:14px;background:#f3f8fb;color:var(--ink);text-align:center;cursor:pointer;transition:background .15s,border-color .15s}
  .kind:hover{background:#eaf3f9}
  .kind.on{border-color:var(--accent);background:#e6f2f9}
  .kind:focus-visible{outline:3px solid rgba(46,127,174,.35);outline-offset:2px}
  .kind-name{margin-top:2px;font-size:15px;font-weight:700;line-height:1.3}
  .kind-desc{font-size:12px;line-height:1.5;color:var(--ink2)}
  .kind-pic{position:relative;display:block;width:84px;height:48px;padding:6px;overflow:hidden;border-radius:8px;background:#fff}
  .pic-list{display:flex;flex-direction:column;justify-content:space-between}
  .pic-list i{display:flex;align-items:center;gap:4px;height:10px}
  .pic-list i::before{content:"";flex:none;width:15px;height:10px;border-radius:2px;background:var(--c)}
  .pic-list i::after{content:"";flex:1;height:4px;border-radius:2px;background:#d5e3ec}
  .pic-list i:nth-child(1){--c:#d98a00}
  .pic-list i:nth-child(2){--c:#15803d}
  .pic-list i:nth-child(3){--c:#2f6fde}
  .pic-cal b{position:absolute;left:6px;right:6px;top:6px;height:6px;border-radius:2px;background:#1e1e1e}
  .pic-cal::before{content:"";position:absolute;left:6px;right:6px;top:15px;bottom:6px;background-image:linear-gradient(90deg,#e3edf3 1px,transparent 1px),linear-gradient(#e3edf3 1px,transparent 1px);background-size:calc(100% / 7) 9px}
  .pic-cal i{position:absolute;height:5px;border-radius:2px}
  .pic-cal i:nth-of-type(1){left:17px;width:34px;top:19px;background:#15803d}
  .pic-cal i:nth-of-type(2){left:40px;width:30px;top:37px;background:#d98a00}
  .pic-tile{display:grid;grid-template-columns:1fr 1fr;gap:3px;padding:5px}
  .pic-tile i{border-radius:3px;background:linear-gradient(to top,rgba(18,30,40,.5) 0,rgba(18,30,40,.5) 35%,transparent 35%),var(--c)}
  .pic-tile i:nth-child(1){--c:#2f6fde}
  .pic-tile i:nth-child(2){--c:#d98a00}
  .pic-tile i:nth-child(3){--c:#15803d}
  .pic-tile i:nth-child(4){--c:#c2410c}
  .monthnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:12px;padding:8px;border-radius:12px;background:#f3f8fb}
  .monthnav[hidden]{display:none}
  .monthnav span{font-size:15px;font-weight:700}
  .soft-btn{min-height:40px;padding:0 14px;border:0;border-radius:10px;background:#fff;color:var(--accent);font-size:14px;font-weight:700;cursor:pointer}
  .soft-btn:hover{background:#e6f2f9}
  .theme-block{margin-top:20px}
  .sub-q{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0 0 10px;font-size:15px;font-weight:700}
  .sub-hint{font-size:12px;font-weight:500;color:var(--ink2)}
  .themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .theme{display:flex;flex-direction:column;align-items:flex-start;gap:2px;min-height:58px;padding:10px 12px;border:2px solid transparent;border-radius:12px;background:#f3f8fb;color:var(--ink);text-align:left;cursor:pointer;transition:background .15s,border-color .15s}
  .theme:hover{background:#eaf3f9}
  .theme.on{border-color:var(--accent);background:#e6f2f9}
  .theme:focus-visible{outline:3px solid rgba(46,127,174,.35);outline-offset:2px}
  .theme-name{font-size:14px;font-weight:700;line-height:1.4}
  .theme-sub{font-family:"Outfit","Zen Kaku Gothic New",sans-serif;font-size:12px;font-weight:500;line-height:1.4;color:var(--ink2)}

  /* 2. 予定えらび（絞り込みは折りたたんで控えめに） */
  .filters{margin:0 0 14px;border-radius:12px;background:#f3f8fb}
  .filters summary{display:flex;flex-wrap:wrap;align-items:center;gap:2px 10px;padding:12px 14px;list-style:none;color:var(--ink2);font-size:14px;font-weight:700;cursor:pointer}
  .filters summary::-webkit-details-marker{display:none}
  .filters summary::before{content:"";flex:none;width:7px;height:7px;margin-right:2px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s}
  .filters[open] summary::before{transform:rotate(45deg)}
  .f-now{font-size:13px;font-weight:500}
  .f-body{padding:0 14px 14px}
  .hint{margin:0;font-size:13px;color:var(--ink2)}
  .f-q{margin:14px 0 8px;font-size:14px;font-weight:700}
  .text{width:100%;height:42px;padding:0 12px;border:1px solid #d9e6ee;border-radius:10px;background:#fff}
  .text:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,127,174,.18)}
  .period{display:flex;align-items:center;gap:8px}
  .period .text{flex:1;min-width:0}
  .types{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:6px}
  .types label{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 10px;border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
  .types input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .types .dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--c)}
  .opts{display:flex;flex-wrap:wrap;gap:6px}
  .opts label{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px 0 10px;border-radius:10px;background:#fff;font-size:14px;cursor:pointer}
  .opts label:has(input:checked){background:#e1eef6}
  .opts input{width:17px;height:17px;margin:0;accent-color:var(--accent)}
  .filters .period{margin-top:8px}
  .filters .period[hidden]{display:none}
  .list-tools{display:flex;flex-direction:column;gap:8px;margin:0 0 12px}
  .search{position:relative}
  .search::before{content:"";position:absolute;left:14px;top:50%;width:11px;height:11px;margin-top:-8px;border:2px solid #8aa9bb;border-radius:50%;pointer-events:none}
  .search::after{content:"";position:absolute;left:26px;top:50%;width:2px;height:7px;margin-top:2px;border-radius:1px;background:#8aa9bb;transform:rotate(-45deg);pointer-events:none}
  .search .text{padding-left:40px;-webkit-appearance:none;appearance:none}
  .tools-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 12px}
  .sort{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--ink2)}
  .select-wrap{position:relative;display:inline-block}
  .select-wrap::after{content:"";position:absolute;right:13px;top:50%;width:6px;height:6px;margin-top:-5px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);pointer-events:none}
  .sort select{height:38px;padding:0 32px 0 12px;border:1px solid #d9e6ee;border-radius:10px;background:#fff;color:var(--ink);font:inherit;font-size:14px;-webkit-appearance:none;appearance:none;cursor:pointer}
  .sort select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,127,174,.18)}
  .only{display:inline-flex;align-items:center;gap:8px;min-height:38px;font-size:13px;color:var(--ink);cursor:pointer}
  .only input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
  .count{margin:0 0 10px;font-size:14px;color:var(--ink2)}
  .count-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;margin:0 0 10px}
  .count-row .count{margin:0}
  .count-btns{display:inline-flex;flex-wrap:wrap;gap:0 14px}
  .link-btn{background:none;border:none;padding:8px 2px;color:var(--accent);font:inherit;font-size:14px;font-weight:700;text-decoration:underline;text-underline-offset:3px;cursor:pointer}
  .link-btn:disabled{color:var(--ink2);text-decoration:none;opacity:.6;cursor:default}
  .warn{margin:0 0 12px;padding:10px 14px;border-radius:12px;background:var(--today-bg);font-size:13px;line-height:1.7}
  .warn[hidden]{display:none}
  .warn p{margin:0}
  .warn p+p{margin-top:4px}
  .cands{display:flex;flex-direction:column;gap:6px}
  .cand{border-radius:12px;background:#fff;box-shadow:0 0 0 1px #edf2f5;transition:background .15s}
  .cand.on{background:#e6f2f9;box-shadow:none}
  .cand-pick{display:grid;grid-template-columns:22px 80px minmax(0,1fr);gap:12px;align-items:center;min-height:64px;padding:10px 12px;cursor:pointer}
  .cand-pick input{width:20px;height:20px;margin:0;accent-color:var(--accent)}
  .cand-thumb{display:block;width:80px;height:45px;border-radius:8px;object-fit:cover;background:#e7eef3}
  .cand-thumb.noimg{display:flex;align-items:center;justify-content:center;background:var(--c);color:#fff;font-size:11px;font-weight:700}
  .cand-meta{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px;min-width:0}
  .cand-date{font-family:"Outfit","Zen Kaku Gothic New",sans-serif;font-size:14px;font-weight:700}
  .cand-off{display:none;padding:1px 8px;border-radius:6px;background:var(--today-bg);color:#8a5300;font-size:12px}
  .cand.off .cand-off{display:inline-block}
  .cand-title{flex-basis:100%;font-size:13px;font-weight:500;line-height:1.5;color:var(--ink);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .cand .text.cand-label{display:block;width:calc(100% - 24px);height:40px;margin:0 12px 10px;font-size:14px}
  .empty-note{margin:0;padding:16px;border-radius:12px;background:#f3f8fb;color:var(--ink2);font-size:14px;line-height:1.7}

  /* 見本と 3. 画像づくり */
  .preview{position:relative;width:100%;max-width:1200px;overflow:hidden;border-radius:12px;background:var(--frame);box-shadow:0 4px 18px rgba(34,57,74,.10)}
  .scaler{width:1200px;height:675px;transform-origin:0 0}
  .cap{margin:10px 0 0;font-size:13px;color:var(--ink2)}
  .out{max-width:1200px;margin-top:28px}
  .btn{min-height:48px;padding:0 20px;border:2px solid #cfe3ef;border-radius:12px;background:#fff;color:var(--accent);font-size:15px;font-weight:700;cursor:pointer;transition:background .15s}
  .btn:hover{background:#f3f8fb}
  .btn.primary{border-color:var(--accent);background:var(--accent);color:#fff}
  .btn.primary:hover{background:#2a74a0}
  .btn.make{min-width:280px;min-height:56px;font-size:17px}
  .btn:disabled{opacity:.55;cursor:default}
  .status{min-height:22px;margin:12px 0 0;font-size:14px;line-height:1.7}
  .status.err{color:#b42318}
  .result{margin-top:16px;padding:16px;border-radius:14px;background:#fff}
  .result[hidden]{display:none}
  .actions{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:560px}
  .result img{display:block;width:100%;height:auto;margin-top:14px;border-radius:10px}
  .note{margin:10px 0 0;font-size:13px;color:var(--ink2);line-height:1.7}

  /* スマホ: 操作パネルを見本の上に積む。iOS の入力時ズームを避けて入力欄は 16px にする */
  @media (max-width:960px){
    .app{flex-direction:column;height:auto}
    .side{width:auto;height:auto;padding:20px 16px 28px}
    .main{overflow:visible;padding:20px 16px 32px}
    .side h1{font-size:22px}
    .kind-pic{width:72px;height:42px}
    .text{height:46px;font-size:16px}
    .period .text{-webkit-appearance:none;appearance:none}
    .cands{max-height:60vh;overflow-y:auto;-webkit-overflow-scrolling:touch}
    .sort select{height:44px;font-size:16px}
    .cand .text.cand-label{font-size:16px}
    .btn.make{width:100%;min-width:0}
    .actions{max-width:none}
  }

  /* ===== 書き出し対象（1200×675） ===== */
  .chip{display:inline-flex;align-items:center;justify-content:center;border-radius:4px;background:var(--c);color:#fff;font-weight:700;white-space:nowrap;letter-spacing:.04em}
  .chip.sm{height:20px;padding:0 7px;border-radius:6px;font-size:11px}

  .stage{width:1200px;height:675px;overflow:hidden;display:flex;flex-direction:column;padding:24px 32px 20px;background:#bcd7e6;color:#22394a;font-family:"Zen Kaku Gothic New",sans-serif;font-weight:500;line-height:1.4;-webkit-font-smoothing:antialiased}
  .s-head{flex:none;height:48px;display:flex;align-items:center;gap:16px}
  .s-logo{flex:none;height:32px;padding:0 9px 0 12px;border-radius:4px;background:#22394a;color:#fff;font-size:17px;font-weight:900;line-height:32px;letter-spacing:.16em}
  .s-title{flex:1;min-width:0;font-size:30px;font-weight:900;line-height:48px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .s-period{flex:none;text-align:right;line-height:1.2}
  .s-period-label{display:block;font-size:12px;font-weight:700;color:#4d6b7d;letter-spacing:.08em}
  .s-period-val{display:block;margin-top:2px;font-size:22px;font-weight:700;white-space:nowrap}
  .s-period-val .d-md,.s-period-val .yr,.s-period-val b{font-family:"Outfit",sans-serif;font-weight:700}
  .s-period-val .yr{margin-right:8px;font-size:15px;color:#4d6b7d}
  .s-period-val .d-dow{margin-left:1px;font-size:13px;color:#4d6b7d}
  .s-period-val .d-sep{margin:0 6px;font-size:16px;color:#4d6b7d}
  .s-period-val .d-sep:last-child{margin-right:0}
  .s-period-val .unit{margin:0 2px;font-size:15px;color:#4d6b7d}
  .s-body{flex:1;min-height:0;margin-top:16px}
  .s-foot{flex:none;height:20px;margin-top:12px;display:flex;align-items:center;justify-content:space-between;color:#4d6b7d;font-size:13px;font-weight:700;letter-spacing:.04em}
  .s-url{font-family:"Outfit",sans-serif;font-size:15px;font-weight:700;color:#2e7fae;letter-spacing:.02em}
  .s-empty{height:100%;display:flex;align-items:center;justify-content:center;border-radius:14px;background:#fff;color:#4d6b7d;font-size:20px;font-weight:700}

  /* リスト（サムネイル付き。寸法は listLayout で件数から決める） */
  .l-panel{height:100%;display:flex;flex-direction:column;justify-content:center;padding:12px 24px;border-radius:14px;background:#fff}
  .l-row{flex:none;display:flex;align-items:center;gap:24px;min-height:0;border-top:1px solid #dce8ef}
  .l-row:first-child{border-top:0}
  .l-thumb{flex:none;position:relative;overflow:hidden;border-radius:10px;background:var(--c)}
  .l-thumb img{position:absolute;left:0;top:0;display:block;width:100%;height:100%;object-fit:cover}
  .l-thumb.noimg{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;letter-spacing:.08em}
  .l-text{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
  .l-top{display:flex;flex-wrap:wrap;align-items:center;row-gap:8px}
  .l-date{white-space:nowrap;line-height:1;color:#22394a}
  .l-date .d-md{font-family:"Outfit",sans-serif;font-weight:800;letter-spacing:.01em}
  .l-date .d-dow{margin-left:2px;font-weight:700;color:#4d6b7d}
  .l-date .d-sun{color:#d64545}
  .l-date .d-sat{color:#2f7fc4}
  .l-date .d-sep{margin:0 6px;color:#4d6b7d}
  .l-label{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden;overflow-wrap:anywhere;font-weight:700;line-height:1.35;color:#22394a}
  /* 件数ごとの大きさ（l5 = 5 件 … l1 = 1 件） */
  .l5 .l-top{column-gap:12px}
  .l5 .d-md{font-size:26px}
  .l5 .d-dow{font-size:13px}
  .l5 .d-sep{font-size:16px}
  .l5 .chip{height:24px;padding:0 9px;font-size:13px}
  .l5 .l-label{margin-top:6px;font-size:20px}
  .l5 .l-thumb.noimg{font-size:16px}
  .l4 .l-top{column-gap:14px}
  .l4 .d-md{font-size:30px}
  .l4 .d-dow{font-size:15px}
  .l4 .d-sep{font-size:18px}
  .l4 .chip{height:26px;padding:0 10px;font-size:14px}
  .l4 .l-label{margin-top:8px;font-size:22px}
  .l4 .l-thumb.noimg{font-size:17px}
  .l3 .l-top{column-gap:14px}
  .l3 .d-md{font-size:36px}
  .l3 .d-dow{font-size:17px}
  .l3 .d-sep{font-size:20px}
  .l3 .chip{height:30px;padding:0 12px;font-size:15px}
  .l3 .l-label{margin-top:10px;font-size:26px}
  .l3 .l-thumb.noimg{font-size:20px}
  .l2 .l-top{column-gap:16px}
  .l2 .d-md{font-size:44px}
  .l2 .d-dow{font-size:20px}
  .l2 .d-sep{font-size:24px}
  .l2 .chip{height:34px;padding:0 14px;font-size:17px}
  .l2 .l-label{margin-top:14px;font-size:32px}
  .l2 .l-thumb.noimg{font-size:24px}
  .l1 .l-top{column-gap:16px}
  .l1 .d-md{font-size:48px}
  .l1 .d-dow{font-size:22px}
  .l1 .d-sep{font-size:26px}
  .l1 .chip{height:36px;padding:0 14px;font-size:18px}
  .l1 .l-label{margin-top:16px;font-size:36px}

<script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script>
// ---- pure:start ----
// ここから pure:end までは DOM に触らない関数だけを置く（Node のテストでこの区間を評価する）
const TYPE_ORDER = ['goods', 'books', 'events', 'web', 'news', 'sale'];
const TYPE_LABELS = {goods:'グッズ', books:'書籍', events:'イベント', web:'Web記事', news:'お知らせ', sale:'セール'};
const DOW = ['日', '月', '火', '水', '木', '金', '土'];

// "2026/1/16" "2026/01/14 12:15:16" "2026-01-22" を、その日の 0 時の Date にする（new Date(文字列) には頼らない）
function parseYMD(s) {
  if (!s) return null;
  const p = String(s).trim().split(/\s+/)[0].split(/[\/-]/).map(Number);
  if (p.length < 3 || p.some(n => !Number.isFinite(n))) return null;
  const d = new Date(p[0], p[1] - 1, p[2]);
  return d.getMonth() === p[1] - 1 ? d : null;
}

// 日付の通し番号（比較・日数計算用。夏時間の影響を受けない）
function dayNum(d) {
  return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()) / 86400000);
}

function addDays(d, n) {
  return new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
}

function pad2(n) {
  return String(n).padStart(2, '0');
}

function toInputValue(d) {
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
}

function ymdCompact(d) {
  return `${d.getFullYear()}${pad2(d.getMonth() + 1)}${pad2(d.getDate())}`;
}

// 行の期間。kind: range=2日以上 / single=単日（開始日だけも含む） / deadline=終了日だけ / none=日付なし
function rowRange(row) {
  const s = parseYMD(row.start_date);
  const e = parseYMD(row.end_date);
  if (s && e) {
    const [a, b] = dayNum(s) <= dayNum(e) ? [s, e] : [e, s];
    return {start: a, end: b, kind: dayNum(a) === dayNum(b) ? 'single' : 'range'};
  }
  if (s) return {start: s, end: s, kind: 'single'};
  if (e) return {start: e, end: e, kind: 'deadline'};
  return {start: null, end: null, kind: 'none'};
}

function overlapsPeriod(range, from, to) {
  if (!range.start) return false;
  return dayNum(range.start) <= dayNum(to) && dayNum(range.end) >= dayNum(from);
}

function inDays(d, from, to) {
  return !!d && dayNum(d) >= dayNum(from) && dayNum(d) <= dayNum(to);
}

// 初期選択（ページを開いたとき）: start_date が期間内に始まる公開の行（前から続いている開催中の行は手で選ぶ）
function isDefaultSelected(row, from, to) {
  if (row.status !== '公開') return false;
  return inDays(parseYMD(row.start_date), from, to);
}

// 開催日の並び: start_date 昇順（なければ end_date、それもなければ投稿日）。同じなら終わる日、投稿日時の順
function eventKey(row) {
  const d = parseYMD(row.start_date) || parseYMD(row.end_date) || parseYMD(row.date);
  return d ? dayNum(d) : Infinity;
}

function endKey(c) {
  return c.range && c.range.end ? dayNum(c.range.end) : eventKey(c.row);
}

function compareByEvent(a, b) {
  return (eventKey(a.row) - eventKey(b.row)) ||
    (endKey(a) - endKey(b)) ||
    String(a.row.date || '').localeCompare(String(b.row.date || ''));
}

// 候補: 公開中の全行を開催日の順に並べる（画像の中の並びもこの順）。絞り込みは一覧の表示だけに効かせる
function buildCandidates(data) {
  return data
    .filter(r => r.status === '公開')
    .map(r => ({row: r, range: rowRange(r)}))
    .sort(compareByEvent);
}

// ---- 画像のテーマ（見出しと、画像の右上に書く期間だけを決める。候補・絞り込み・選択には関わらない） ----
const THEME_ORDER = ['upcoming', 'thisweek', 'nextweek', 'thismonth'];
const THEMES = {upcoming: 'これからの予定', thisweek: '今週のまとめ', nextweek: '来週の予定', thismonth: '今月の予定'};

// その日を含む週の月曜日（週は月曜はじまり）
function weekStart(d) {
  return addDays(d, -((d.getDay() + 6) % 7));
}

// テーマか月の指定から、見出し・画像の右上の表示・カレンダーの表示月を決める
//   label: 右上の小さなラベル / from〜to: 右上の期間（to が null なら「from〜」） / show: range か month（「2026年11月」と書く）
//   posted: 新着のまとめ（カレンダーの形でも月ではなく期間を書く）
//   monthMode: カレンダーで月を送ったら、見出しと右上の表示もその月に合わせる
// month（{year, month}）があればそちらを優先し、見出しは「YYYY年M月の予定」
function themeSetup(theme, month, today) {
  if (month) {
    const g = monthGrid(month.year, month.month);
    return {theme: null, heading: `${month.year}年${month.month + 1}月の予定`, label: 'この月の予定', from: g.first, to: g.last,
      show: 'month', posted: false, calYear: month.year, calMonth: month.month, monthMode: true};
  }
  const t = THEME_ORDER.includes(theme) ? theme : 'upcoming';
  const base = {theme: t, heading: THEMES[t], show: 'range', posted: false, monthMode: false};
  if (t === 'thisweek' || t === 'nextweek') {
    const s = addDays(weekStart(today), t === 'nextweek' ? 7 : 0);
    return Object.assign(base, {label: t === 'thisweek' ? 'この期間の新着' : 'この期間の予定', from: s, to: addDays(s, 6),
      posted: t === 'thisweek', calYear: s.getFullYear(), calMonth: s.getMonth()});
  }
  if (t === 'thismonth') {
    const g = monthGrid(today.getFullYear(), today.getMonth());
    return Object.assign(base, {label: 'この期間の予定', from: g.first, to: g.last, calYear: today.getFullYear(), calMonth: today.getMonth(), monthMode: true});
  }
  return Object.assign(base, {label: 'この日からの予定', from: today, to: null, calYear: today.getFullYear(), calMonth: today.getMonth()});
}

// ---- しぼりこみ（一覧の表示だけを変える。チェックした行は隠れても画像に入る） ----
const POSTED_MODES = {all: 'すべて', thisweek: '今週', lastweek: '先週', thismonth: '今月', custom: '日付を指定'};
const EVENT_MODES = {all: 'すべて', thisweek: '今週', nextweek: '来週', thismonth: '今月', nextmonth: '来月', custom: '日付を指定'};
const STATUS_KEYS = ['current', 'upcoming', 'ended'];
const STATUS_LABELS = {current: 'いま開催中', upcoming: 'これから', ended: 'おわったもの'};

// しぼりこみの日付の範囲。null は「絞らない」。from / to の片方が null なら、そちら側は区切らない
function rangeFor(mode, today, custom) {
  if (mode === 'thisweek' || mode === 'lastweek' || mode === 'nextweek') {
    const s = addDays(weekStart(today), mode === 'lastweek' ? -7 : mode === 'nextweek' ? 7 : 0);
    return {from: s, to: addDays(s, 6)};
  }
  if (mode === 'thismonth' || mode === 'nextmonth') {
    const g = monthGrid(today.getFullYear(), today.getMonth() + (mode === 'nextmonth' ? 1 : 0));
    return {from: g.first, to: g.last};
  }
  if (mode === 'custom') {
    const a = custom && custom.from ? custom.from : null;
    const b = custom && custom.to ? custom.to : null;
    if (!a && !b) return null;
    return a && b && dayNum(a) > dayNum(b) ? {from: b, to: a} : {from: a, to: b};
  }
  return null;
}

// 日が範囲に入るか（範囲が null なら常に true、日がなければ false）
function inRange(d, range) {
  if (!range) return true;
  if (!d) return false;
  const n = dayNum(d);
  return (!range.from || n >= dayNum(range.from)) && (!range.to || n <= dayNum(range.to));
}

// 開催期間（rowRange）が範囲に重なるか。日付のない行は「絞らない」ときだけ通す
function overlapsRange(r, range) {
  if (!range) return true;
  if (!r || !r.start) return false;
  return (!range.to || dayNum(r.start) <= dayNum(range.to)) && (!range.from || dayNum(r.end) >= dayNum(range.from));
}

// 開催の状況（トップページと同じ考え方）。日付が両方空なら開催中、start_date＞今日ならこれから、end_date＜今日ならおわった、ほかは開催中
function eventStatus(row, today) {
  const s = parseYMD(row.start_date);
  const e = parseYMD(row.end_date);
  if (!s && !e) return 'current';
  if (s && dayNum(s) > dayNum(today)) return 'upcoming';
  if (e && dayNum(e) < dayNum(today)) return 'ended';
  return 'current';
}

// 絞らない状態（「しぼりこみを解除」で戻る先）
function defaultFilters() {
  return {
    posted: 'all', postedCustom: {from: null, to: null},
    status: new Set(STATUS_KEYS),
    event: 'all', eventCustom: {from: null, to: null},
    types: new Set(TYPE_ORDER),
    query: '',
    onlyChecked: false
  };
}

// いずれかの条件が既定から変わっているか
function filtersActive(f) {
  return f.posted !== 'all' || f.event !== 'all' || f.status.size !== STATUS_KEYS.length ||
    f.types.size !== TYPE_ORDER.length || normalizeText(f.query).trim() !== '' || !!f.onlyChecked;
}

// 条件をまとめて判定する関数を作る（範囲は 1 回だけ計算する）。条件はすべて AND
// test(c, checked, editedLabel): c は {row, range}、checked はその行がチェック済みか、editedLabel は編集モードで書きかえたラベル
function filterMatcher(f, today) {
  const posted = f.posted === 'all' ? null : rangeFor(f.posted, today, f.postedCustom);
  const event = f.event === 'all' ? null : rangeFor(f.event, today, f.eventCustom);
  const allStatus = f.status.size === STATUS_KEYS.length;
  return (c, checked, editedLabel) => {
    if (!f.types.has(c.row.type)) return false;
    if (f.onlyChecked && !checked) return false;
    if (!inRange(parseYMD(c.row.date), posted)) return false;
    if (!allStatus && !f.status.has(eventStatus(c.row, today))) return false;
    if (!overlapsRange(c.range, event)) return false;
    return matchesQuery(defaultLabel(c.row), f.query) || (editedLabel != null && matchesQuery(editedLabel, f.query));
  };
}

// 折りたたんでいても今の条件が分かる要約（キーワードと「えらんだ予定だけ」は一覧の上に見えているので含めない）
function filterSummary(f) {
  const md = d => `${d.getMonth() + 1}/${d.getDate()}`;
  const custom = c => (c.from || c.to ? `${c.from ? md(c.from) : ''}〜${c.to ? md(c.to) : ''}` : '日付を指定（未入力）');
  const parts = [];
  if (f.posted !== 'all') parts.push(`告知：${f.posted === 'custom' ? custom(f.postedCustom) : POSTED_MODES[f.posted]}`);
  if (f.status.size !== STATUS_KEYS.length) parts.push(`状況：${f.status.size ? STATUS_KEYS.filter(k => f.status.has(k)).map(k => STATUS_LABELS[k]).join('・') : 'なし'}`);
  if (f.event !== 'all') parts.push(`開催日：${f.event === 'custom' ? custom(f.eventCustom) : EVENT_MODES[f.event]}`);
  if (f.types.size !== TYPE_ORDER.length) parts.push(`種類：${f.types.size ? TYPE_ORDER.filter(t => f.types.has(t)).map(t => TYPE_LABELS[t]).join('・') : 'なし'}`);
  return parts.length ? parts.join('／') : 'すべての予定を表示中';
}

// 告知の投稿日時 "2026/1/16 12:04" "2026/01/14 12:15:16" "2026-01-22" を並べ替え用の数値にする（split で読む。読めなければ null）
function postedAt(s) {
  if (!s) return null;
  const [datePart, timePart = ''] = String(s).trim().split(/\s+/);
  const d = datePart.split(/[\/-]/).map(Number);
  if (d.length < 3 || d.some(n => !Number.isFinite(n))) return null;
  const t = timePart.split(':').map(n => (Number.isFinite(Number(n)) ? Number(n) : 0));
  return Date.UTC(d[0], d[1] - 1, d[2], t[0] || 0, t[1] || 0, t[2] || 0);
}

// 候補一覧の表示の並べ替え（new: 新しい順 / old: 古い順 / soon: 開催日が近い順）。元の配列は変えない
// 投稿日時が同じなら開催日の順。投稿日時が読めない行は、どちらの向きでも最後
function sortCands(list, mode) {
  const arr = list.slice();
  if (mode === 'soon') return arr.sort(compareByEvent);
  const dir = mode === 'old' ? 1 : -1;
  return arr.sort((a, b) => {
    const x = postedAt(a.row.date);
    const y = postedAt(b.row.date);
    if (x == null || y == null) return (x == null) - (y == null);
    return (x - y) * dir || compareByEvent(a, b);
  });
}

// 検索用に文字をそろえる（全角半角の英数字・大文字小文字の違いをなくす）
function normalizeText(s) {
  return String(s == null ? '' : s).normalize('NFKC').toLowerCase();
}

// キーワードに部分一致するか。空白で区切ったときは、すべてのことばを含むものだけ
function matchesQuery(text, query) {
  const terms = normalizeText(query).split(/\s+/).filter(Boolean);
  if (!terms.length) return true;
  const t = normalizeText(text);
  return terms.every(w => t.includes(w));
}

function authorFromUrl(url) {
  const m = String(url || '').match(/^https?:\/\/(?:www\.)?(?:x|twitter)\.com\/([^\/?#]+)/i);
  return m ? m[1] : '';
}

function defaultLabel(row) {
  const t = String(row.title || '').trim();
  if (t) return t;
  const a = authorFromUrl(row.url);
  return a ? `@${a} の投稿` : (TYPE_LABELS[row.type] || '');
}

// サムネイル URL の正規化（pbs.twimg.com は medium サイズに寄せる）
function normalizeThumb(url, size) {
  const name = size || 'medium';
  if (!url) return '';
  let u;
  try { u = new URL(String(url).trim()); } catch (e) { return ''; }
  // https のページから http の画像は html-to-image の fetch が mixed content で止まるため https にそろえる
  if (u.protocol === 'http:') u.protocol = 'https:';
  if (u.hostname !== 'pbs.twimg.com') return u.href;
  const m = u.pathname.match(/^(.*)\.(jpe?g|png|webp|gif)$/i);
  if (m) {
    const ext = m[2].toLowerCase();
    u.pathname = m[1];
    u.search = '';
    u.searchParams.set('format', ext === 'jpeg' ? 'jpg' : ext);
    u.searchParams.set('name', name);
    return u.href;
  }
  if (u.searchParams.has('format')) {
    const cur = u.searchParams.get('name');
    if (!cur || /^(small|thumb|tiny|medium)$/.test(cur)) u.searchParams.set('name', name);
  }
  return u.href;
}

// 日付の表示部品。refYear と年が違う日だけ年を付ける（refYear が null なら年は付けない）
function dateTokens(range, refYear) {
  if (!range || !range.start) return [];
  const md = d => ({t: 'md', v: (refYear != null && d.getFullYear() !== refYear ? d.getFullYear() + '/' : '') + (d.getMonth() + 1) + '/' + d.getDate()});
  const dw = d => ({t: 'dow', v: '(' + DOW[d.getDay()] + ')', day: d.getDay()});
  const sep = {t: 'sep', v: '〜'};
  if (range.kind === 'deadline') return [sep, md(range.end), dw(range.end)];
  if (range.kind === 'range') return [md(range.start), dw(range.start), sep, md(range.end), dw(range.end)];
  return [md(range.start), dw(range.start)];
}

function formatRange(range, refYear) {
  return dateTokens(range, refYear).map(t => t.v).join('');
}

// 月グリッド（日曜始まり）。month は 0 始まり
function monthGrid(year, month) {
  const first = new Date(year, month, 1);
  const days = new Date(year, month + 1, 0).getDate();
  return {
    first,
    last: new Date(year, month, days),
    gridStart: addDays(first, -first.getDay()),
    days,
    weeks: Math.ceil((first.getDay() + days) / 7)
  };
}

// 選んだ予定を月グリッドの週ごとの区間に分ける。期間は表示月の内側に切り詰め、週をまたいだら分割する
// items: [{range}] / 戻り値の segments[].idx は items の添字
function calendarSegments(items, year, month) {
  const grid = monthGrid(year, month);
  const ms = dayNum(grid.first);
  const me = dayNum(grid.last);
  const gs = dayNum(grid.gridStart);
  const segments = [];
  const outside = [];
  items.forEach((it, idx) => {
    const r = it.range;
    if (!r || !r.start) { outside.push(idx); return; }
    const s = dayNum(r.start);
    const e = dayNum(r.end);
    if (e < ms || s > me) { outside.push(idx); return; }
    if (r.kind !== 'range') {
      segments.push({idx, kind: r.kind, week: Math.floor((s - gs) / 7), col: (s - gs) % 7, span: 1, contPrev: false, contNext: false});
      return;
    }
    const cs = Math.max(s, ms);
    const ce = Math.min(e, me);
    for (let d = cs; d <= ce;) {
      const week = Math.floor((d - gs) / 7);
      const segEnd = Math.min(ce, gs + week * 7 + 6);
      segments.push({idx, kind: 'range', week, col: (d - gs) % 7, span: segEnd - d + 1, contPrev: d > s, contNext: segEnd < e});
      d = segEnd + 1;
    }
  });
  return {grid, segments, outside};
}

// 週ごとにレーン（段）を割り当てる。期間バーを先に、開始の早い順・長い順で、空いている一番上の段へ
function assignLanes(segments) {
  const byWeek = new Map();
  segments.forEach(s => {
    if (!byWeek.has(s.week)) byWeek.set(s.week, []);
    byWeek.get(s.week).push(s);
  });
  byWeek.forEach(list => {
    list.sort((a, b) =>
      ((a.kind === 'range' ? 0 : 1) - (b.kind === 'range' ? 0 : 1)) ||
      (a.col - b.col) || (b.span - a.span) || (a.idx - b.idx));
    const lanes = [];
    list.forEach(s => {
      const end = s.col + s.span - 1;
      let li = 0;
      while (lanes[li] && lanes[li].some(([c1, c2]) => s.col <= c2 && end >= c1)) li++;
      (lanes[li] = lanes[li] || []).push([s.col, end]);
      s.lane = li;
    });
  });
  return segments;
}

// 1 週の高さに入る段数
function laneCapacity(rowH, dim) {
  return Math.max(0, Math.floor((rowH - dim.numH - dim.gap - dim.padB) / (dim.laneH + dim.gap)));
}

// 段からあふれた区間を数える。more: "週-列" → 件数 / hidden: あふれた区間を持つ items の添字
function overflowInfo(segments, cap) {
  const more = {};
  const hidden = new Set();
  segments.forEach(s => {
    if (s.lane < cap) return;
    hidden.add(s.idx);
    for (let c = s.col; c < s.col + s.span; c++) {
      const k = s.week + '-' + c;
      more[k] = (more[k] || 0) + 1;
    }
  });
  return {more, hidden};
}

// タイルの並び。空の行を作らない列×行の中から、1枚の縦横比が 1.6 に近く空きの少ないものを選ぶ
function tileLayout(n, W, H, gap) {
  if (n <= 0) return {cols: 1, rows: 1, w: W, h: H};
  let best = null;
  for (let rows = 1; rows <= n; rows++) {
    const cols = Math.ceil(n / rows);
    if (cols * (rows - 1) >= n) continue;
    const w = (W - gap * (cols - 1)) / cols;
    const h = (H - gap * (rows - 1)) / rows;
    const score = Math.abs(Math.log((w / h) / 1.6)) + 0.25 * (cols * rows - n);
    if (!best || score < best.score) best = {cols, rows, w, h, score};
  }
  return best;
}

// リスト型の寸法（最大 5 件）。行の高さは内側の高さを件数で等分し、サムネイルは 16:9 で行の上下に余白を残す。
// 1 件のときはサムネイルが大きくなりすぎて文字の場所がなくならないよう、幅を内側の半分までにする
function listLayout(n, innerW, innerH) {
  const count = Math.min(Math.max(n, 1), 5);
  const rowH = Math.floor(innerH / count);
  const pad = [24, 16, 12, 10, 8][count - 1];
  let thumbH = rowH - pad * 2;
  let thumbW = Math.round(thumbH * 16 / 9);
  const maxW = Math.floor(innerW / 2);
  if (thumbW > maxW) {
    thumbW = maxW;
    thumbH = Math.round(maxW * 9 / 16);
  }
  return {rowH, pad, thumbW, thumbH, size: 'l' + count};
}

// URL の指定（?kind=calendar&month=2026-11&theme=thisweek&edit=1）を読む。不正な値は null（＝今の既定値のまま）
function parseShareParams(search) {
  const q = new URLSearchParams(String(search || ''));
  const kind = q.get('kind');
  const theme = q.get('theme');
  const m = /^(\d{4})-(\d{2})$/.exec(q.get('month') || '');
  let month = null;
  if (m) {
    const y = Number(m[1]);
    const mo = Number(m[2]);
    if (y >= 1970 && mo >= 1 && mo <= 12) month = {year: y, month: mo - 1};
  }
  return {
    kind: ['list', 'calendar', 'tile'].includes(kind) ? kind : null,
    theme: THEME_ORDER.includes(theme) ? theme : null,
    month,
    edit: q.get('edit') === '1'
  };
}

// ---- 書き出し用フォント（画像に出てくる文字だけを Google Fonts の text= で取り寄せる） ----
const FONT_CSS_BASE = 'https://fonts.googleapis.com/css2?family=Outfit:wght@500;700;800&family=Zen+Kaku+Gothic+New:wght@500;700;900';

// 画像内の文字を重複なしで並べる（改行・タブは除く。省略記号「…」は text-overflow で描かれるので必ず入れる）
function fontChars(text) {
  const set = new Set(Array.from(String(text == null ? '' : text) + '…'));
  ['\n', '\r', '\t'].forEach(c => set.delete(c));
  return Array.from(set).sort().join('');
}

function fontCssUrl(chars) {
  return `${FONT_CSS_BASE}&text=${encodeURIComponent(chars)}&display=swap`;
}

const CSS_URL_RE = /url\(\s*(['"]?)([^'")]+)\1\s*\)/g;

// CSS の url(...) を重複なしで取り出す（data: は除く）
function cssUrls(css) {
  const out = [];
  String(css).replace(CSS_URL_RE, (m, q, u) => {
    if (!/^data:/i.test(u) && !out.includes(u)) out.push(u);
    return m;
  });
  return out;
}

// CSS の url(...) を map（URL → data URL）で置き換える。map にない URL はそのまま
function replaceCssUrls(css, map) {
  return String(css).replace(CSS_URL_RE, (m, q, u) => (Object.prototype.hasOwnProperty.call(map, u) ? `url(${map[u]})` : m));
}

// WebKit（iPhone/iPad の全ブラウザ、または Chrome 系でない AppleWebKit）か
function isWebKitUA(ua) {
  const s = String(ua || '');
  return /iPhone|iPad|iPod/.test(s) || (/AppleWebKit/.test(s) && !/Chrome\/|Chromium|Edg\//.test(s));
}

      </div>`;
    }).join('');
  }

  candsEl.addEventListener('change', e => {
    if (e.target.type !== 'checkbox') return;
    const c = state.cands[Number(e.target.closest('.cand').dataset.i)];
    if (!c) return;
    state.checked.set(keyOf(c.row), e.target.checked);
    renderStage();
  });

  // 候補をすべて外す（検索などで一覧に出ていない行も含める）
  $('candClear').addEventListener('click', () => {
    state.cands.forEach(c => state.checked.set(keyOf(c.row), false));
    renderCandList();
    renderStage();
  });

  let stageTimer = 0;
  function renderStageSoon() {
    // 反映を待つ 150ms の間も、前にできた画像は内容が古いので使わせない
    state.version++;
    if (state.result) {
      clearResult();
      setStatus('');
    }
    clearTimeout(stageTimer);
    stageTimer = setTimeout(renderStage, 150);
  }

  candsEl.addEventListener('input', e => {
    if (!e.target.classList.contains('cand-label')) return;
    const c = state.cands[Number(e.target.closest('.cand').dataset.i)];
    if (!c) return;
    state.labels.set(keyOf(c.row), e.target.value);
    renderStageSoon();
  });

  // 一覧の小さいサムネイルが読めなければ種別色のブロックにする（error はバブリングしないので capture で拾う）
  candsEl.addEventListener('error', e => {
    const img = e.target;
    if (!(img instanceof HTMLImageElement)) return;
    failedThumbs.add(img.getAttribute('src'));
    const span = document.createElement('span');
    span.className = 'cand-thumb noimg';
    const c = state.cands[Number(img.closest('.cand').dataset.i)];
    span.textContent = c ? typeLabel(c.row.type) : '';
    img.replaceWith(span);
  }, true);

  // ===== 画像（ステージ） =====
  function headHtml(periodLabel, periodVal) {
    return `<div class="s-head">
      <div class="s-logo">墓場文庫</div>
      <div class="s-title">${esc(state.heading)}</div>
      <div class="s-period"><span class="s-period-label">${periodLabel}</span><span class="s-period-val">${periodVal}</span></div>
    </div>`;
  }

  function footHtml() {
    return `<div class="s-foot"><span>墓場文庫｜最新情報ポータル</span><span class="s-url">info.hakaba-bunko.net</span></div>`;
  }

  function periodValHtml(from, to) {
    const y = from.getFullYear();
    if (!to) return `<span class="yr">${y}</span>${tokensHtml(dateTokens({start: from, end: from, kind: 'single'}, y))}<span class="d-sep">〜</span>`;
    const range = dayNum(from) === dayNum(to) ? {start: from, end: from, kind: 'single'} : {start: from, end: to, kind: 'range'};
    return `<span class="yr">${y}</span>${tokensHtml(dateTokens(range, y))}`;
  }

  function monthValHtml(y, m) {
    return `<b>${y}</b><span class="unit">年</span><b>${m + 1}</b><span class="unit">月</span>`;
  }

  // リストのサムネイルが読めないときの代わり（種別色のブロックに種別名）
  function listThumbFallback(type) {
    return `<span>${esc(typeLabel(type))}</span>`;
  }

  function renderList(items, warns, shown) {
    const list = items.slice(0, LIST_MAX);
    if (items.length > LIST_MAX) {
      warns.push(`リストにのせられるのは ${LIST_MAX} 件までです。開催日の早い順に ${LIST_MAX} 件をのせています。`);
    }
    list.forEach(it => shown.add(it.key));
    if (!list.length) return '<div class="s-empty">予定がまだ選ばれていません</div>';
    const lay = listLayout(list.length, LIST_INNER_W, LIST_INNER_H);
    const rows = list.map(it => {
      const useImg = it.thumb && !failedThumbs.has(it.thumb);
      const thumb = `<div class="l-thumb ty-${esc(it.type)}${useImg ? '' : ' noimg'}" data-type="${esc(it.type)}" style="width:${lay.thumbW}px;height:${lay.thumbH}px">${
        useImg ? `<img crossorigin="anonymous" src="${esc(it.thumb)}" alt="">` : listThumbFallback(it.type)}</div>`;
      return `<div class="l-row" style="height:${lay.rowH}px">
        ${thumb}
        <div class="l-text">
          <div class="l-top"><span class="l-date">${tokensHtml(dateTokens(it.range, null))}</span><span class="chip ty-${esc(it.type)}">${esc(typeLabel(it.type))}</span></div>
          <div class="l-label">${esc(it.label)}</div>
        </div>
      </div>`;
    }).join('');
    return `<div class="l-panel ${lay.size}">${rows}</div>`;
  }

  function renderCalendar(items, warns, shown) {
    const y = state.calYear;
    const m = state.calMonth;
    const {grid, segments, outside} = calendarSegments(items, y, m);
    assignLanes(segments);
    const dense = grid.weeks >= 6;
    const dim = dense ? CAL_DIM.dense : CAL_DIM.normal;
    const rowH = (CAL_WEEKS_H - CAL_WEEK_GAP * (grid.weeks - 1)) / grid.weeks;
    const cap = laneCapacity(rowH, dim);
    const {more, hidden} = overflowInfo(segments, cap);

    items.forEach((it, idx) => {
      if (!outside.includes(idx) && !hidden.has(idx)) shown.add(it.key);
    });
    // 日付のない行（「今週のまとめ」で入ることがある）は、ほかの月とは分けて知らせる
    const noDate = outside.filter(idx => !items[idx].range || !items[idx].range.start).length;
    if (outside.length - noDate) {
      warns.push(`カレンダーには ${m + 1} 月の予定だけがのります。ほかの月の ${outside.length - noDate} 件はのっていません。`);
    }
    if (noDate) {
      warns.push(`日付のない予定 ${noDate} 件は、カレンダーにはのりません。`);
    }
    if (hidden.size) {
      warns.push(`予定が多くて、日の枠に入りきらないものが ${hidden.size} 件あります。その日の右上に「+件数」を出しています。`);
    }

    const rowsTpl = `${dim.numH}px ${cap ? `repeat(${cap}, ${dim.laneH}px) ` : ''}1fr`;
    const todayN = dayNum(today);
    let weeksHtml = '';
    for (let w = 0; w < grid.weeks; w++) {
      let cells = '';
      let nums = '';
      for (let c = 0; c < 7; c++) {
        const d = addDays(grid.gridStart, w * 7 + c);
        const out = d.getMonth() !== m;
        const isToday = !out && dayNum(d) === todayN;
        cells += `<div class="c-cell${out ? ' out' : ''}${isToday ? ' today' : ''}" style="grid-column:${c + 1}"></div>`;
        nums += `<div class="c-num${c === 0 ? ' sun' : c === 6 ? ' sat' : ''}${out ? ' out' : ''}" style="grid-column:${c + 1}">${d.getDate()}</div>`;
        const n = more[w + '-' + c];
        if (n) nums += `<div class="c-more" style="grid-column:${c + 1}">+${n}</div>`;
      }
      const segs = segments.filter(s => s.week === w && s.lane < cap).map(s => {
        const it = items[s.idx];
        const pos = `grid-column:${s.col + 1} / span ${s.span};grid-row:${s.lane + 2}`;
        if (s.kind === 'range') {
          return `<div class="c-bar ty-${esc(it.type)}${s.contPrev ? ' cp' : ''}${s.contNext ? ' cn' : ''}" style="${pos}">${esc(it.label)}</div>`;
        }
        const head = s.kind === 'deadline' ? '<span class="mark">〆</span>' : '<span class="dot"></span>';
        return `<div class="c-chip ty-${esc(it.type)}" style="${pos}">${head}<span class="txt">${esc(it.label)}</span></div>`;
      }).join('');
      weeksHtml += `<div class="c-week" style="grid-template-rows:${rowsTpl};row-gap:${dim.gap}px">${cells}${nums}${segs}</div>`;
    }
    return `<div class="c-panel ${dense ? 'c-dense' : 'c-normal'}">
      <div class="c-wk">${DOW.map(d => `<div>${d}</div>`).join('')}</div>
      <div class="c-weeks" style="grid-template-rows:repeat(${grid.weeks}, minmax(0, 1fr))">${weeksHtml}</div>
    </div>`;
  }

  function tileFallbackInner(it) {
    return `<div class="t-fb-type">${esc(typeLabel(it.type))}</div>
      <div class="t-fb-label"><span>${esc(it.label)}</span></div>
      <div class="t-fb-date">${tokensHtml(dateTokens(it.range, null))}</div>`;
  }

  function tileImageInner(it) {
    return `<img crossorigin="anonymous" src="${esc(it.thumb)}" alt="">
      <div class="t-over">
        <div class="t-meta"><span class="chip">${esc(typeLabel(it.type))}</span><span class="t-date">${tokensHtml(dateTokens(it.range, null))}</span></div>
        <div class="t-label">${esc(it.label)}</div>
      </div>`;
  }

  function renderTile(items, warns, shown) {
    const list = items.slice(0, TILE_MAX);
    if (items.length > TILE_MAX) {
      warns.push(`画像タイルにのせられるのは ${TILE_MAX} 件までです。開催日の早い順に ${TILE_MAX} 件をのせています。`);
    } else if (items.length && items.length < TILE_MIN) {
      warns.push(`画像タイルは ${TILE_MIN}〜${TILE_MAX} 件えらぶと、きれいに並びます（いまは ${items.length} 件）。`);
    }
    list.forEach(it => shown.add(it.key));
    state.tileItems = list;
    if (!list.length) return '<div class="s-empty">予定がまだ選ばれていません</div>';
    const lay = tileLayout(list.length, BODY_W, BODY_H, TILE_GAP);
    const w = Math.floor(lay.w);
    const h = Math.floor(lay.h);
    const size = w >= 500 ? 't-l' : w >= 330 ? 't-m' : 't-s';
    const tiles = list.map((it, i) => {
      const useImg = it.thumb && !failedThumbs.has(it.thumb);
      return `<div class="t-tile ty-${esc(it.type)}${useImg ? '' : ' noimg'}" data-i="${i}" style="width:${w}px;height:${h}px">${useImg ? tileImageInner(it) : tileFallbackInner(it)}</div>`;
    }).join('');
    return `<div class="t-grid ${size}">${tiles}</div>`;
  }

  // 読み込めなかったタイル・リストの画像は DOM から外して種別色のブロックに置き換える
  // （img を残すと html-to-image が src="" を読んで書き出し全体が失敗する）
  function toFallback(img) {
    failedThumbs.add(img.getAttribute('src'));
    const thumb = img.closest('.l-thumb');
    if (thumb) {
      thumb.classList.add('noimg');
      thumb.innerHTML = listThumbFallback(thumb.dataset.type);
      return;
    }
    const tile = img.closest('.t-tile');
    if (!tile) { img.remove(); return; }
    const it = state.tileItems[Number(tile.dataset.i)];
    tile.classList.add('noimg');
    if (it) tile.innerHTML = tileFallbackInner(it);
    else img.remove();
  }

  stage.addEventListener('error', e => {
    if (e.target instanceof HTMLImageElement) toFallback(e.target);
  }, true);

  // includePending: 書き出し時は、待ち時間を打ち切った時点で読み込み中のものも代替表示にする
  function sweepBrokenImages(includePending = false) {
    stage.querySelectorAll('img').forEach(img => {
      if (img.complete ? !img.naturalWidth : includePending) toFallback(img);
    });
  }

  function renderWarnings(warns) {
    const el = $('warn');
    el.hidden = !warns.length;
    el.innerHTML = warns.map(w => `<p>${esc(w)}</p>`).join('');
  }

  function renderStage() {
    clearTimeout(stageTimer);
    stageTimer = 0;
    state.version++;
    // 内容が変わったら、前にできた画像は使えないので片付ける
    if (state.result) {
      clearResult();
      setStatus('');
    }
    const d = state.disp;
    const items = state.cands.filter(c => isChecked(c.row)).map(c => ({
      key: keyOf(c.row),
      type: c.row.type,
      range: c.range,
      label: labelOf(c.row),
      thumb: normalizeThumb(c.row.thumbnail)
    }));
    const warns = [];
    const shown = new Set();
    let body = '';
    let head = '';
    // 右上はテーマが決める。カレンダーの形は表示月（新着のまとめは、月の予定一覧と読まれないよう期間）
    if (state.kind === 'calendar') {
      body = renderCalendar(items, warns, shown);
      head = d.posted
        ? headHtml(d.label, periodValHtml(d.from, d.to))
        : headHtml('この月の予定', monthValHtml(state.calYear, state.calMonth));
    } else {
      body = state.kind === 'tile' ? renderTile(items, warns, shown) : renderList(items, warns, shown);
      head = d.show === 'month'
        ? headHtml(d.label, monthValHtml(d.from.getFullYear(), d.from.getMonth()))
        : headHtml(d.label, periodValHtml(d.from, d.to));
    }
    if (!items.length) warns.push('予定がまだ選ばれていません。下の一覧から、のせたい予定にチェックを入れてください。');

    stage.innerHTML = head + `<div class="s-body">${body}</div>` + footHtml();
    sweepBrokenImages();
    renderWarnings(warns);

    // 候補一覧の「選択中だが画像に入っていない」印と件数（一覧は描き直さない。チェックを外した行も次に描き直すまで残す）
    state.shownKeys = shown;
    candsEl.querySelectorAll('.cand').forEach(el => {
      const c = state.cands[Number(el.dataset.i)];
      if (!c) return;
      const k = keyOf(c.row);
      el.classList.toggle('on', isChecked(c.row));
      el.classList.toggle('off', isChecked(c.row) && !shown.has(k));
    });
    updateCount();
    $('monthLabel').textContent = `${state.calYear}年${state.calMonth + 1}月`;
  }

  // ===== プレビューの縮小表示（transform は stage ではなく外側の .scaler に掛ける） =====
  const previewEl = $('preview');
  const scalerEl = $('scaler');
  function fitPreview() {
    const s = Math.min(1, previewEl.clientWidth / 1200);
    scalerEl.style.transform = `scale(${s})`;
    previewEl.style.height = `${Math.round(675 * s)}px`;
  }
  new ResizeObserver(fitPreview).observe(previewEl);
  fitPreview();

  // ===== 操作 =====
  // 画像の形を切り替える（カード型のボタンの見た目と、カレンダーの月送りの表示もそろえる）
  function setKind(kind) {
    state.kind = kind;
    $('kindSeg').querySelectorAll('button[data-kind]').forEach(x => {
      const on = x.dataset.kind === kind;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    $('monthNav').hidden = kind !== 'calendar';
  }
  setKind(state.kind);   // URL の kind 指定を反映

  $('kindSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-kind]');
    if (!b) return;
    setKind(b.dataset.kind);
    renderStage();
  });

  // 月を送る（選択は変えない）。月の見出し（URL の month 指定・「今月の予定」）のときは、見出しと右上の表示もその月に合わせる
  // それ以外のテーマでは、カレンダーの表示月だけが変わる
  function shiftMonth(n) {
    const d = new Date(state.calYear, state.calMonth + n, 1);
    state.calYear = d.getFullYear();
    state.calMonth = d.getMonth();
    if (state.disp.monthMode) applyTheme(themeSetup(null, {year: state.calYear, month: state.calMonth}, today), false);
    renderStage();
  }
  $('prevMonth').addEventListener('click', () => shiftMonth(-1));
  $('nextMonth').addEventListener('click', () => shiftMonth(1));

  // 見出しの入力欄は編集モードのときだけ DOM に出す
  if (EDIT) {
    const badge = document.createElement('p');
    badge.className = 'edit-badge';
    badge.textContent = '編集モードです。画像の見出しと、予定ごとの文字を書きかえられます（保存はされません）。';
    document.querySelector('.lead').after(badge);
    const sec = document.createElement('section');
    sec.className = 'step';
    sec.innerHTML = `<h2 class="q"><label for="heading">画像の見出しは何にしますか？</label></h2>
      <input type="text" class="text" id="heading" value="${esc(state.heading)}">`;
    $('kindSec').after(sec);
    $('heading').addEventListener('input', e => {
      state.heading = e.target.value;
      state.headingAuto = false;
      renderStageSoon();
    });
  }

  // ----- 画像のテーマ（見出し・右上の表示・カレンダーの表示月だけを変える。候補・しぼりこみ・選択には触らない） -----
  // 見出しは、自動のままか、テーマを選び直したとき（force）だけ書きかえる
  function applyTheme(setup, force) {
    state.theme = setup.theme;
    state.disp = setup;
    if (force || state.headingAuto) {
      state.heading = setup.heading;
      state.headingAuto = true;
      if (EDIT) $('heading').value = setup.heading;
    }
    renderThemeButtons();
  }

  const mdText = d => `${d.getMonth() + 1}/${d.getDate()}`;
  $('themeSeg').innerHTML = THEME_ORDER.map(t => {
    const p = themeSetup(t, null, today);
    const sub = `${mdText(p.from)}〜${p.to ? mdText(p.to) : ''}`;
    return `<button type="button" class="theme" data-theme="${t}" aria-pressed="false"><span class="theme-name">${esc(THEMES[t])}</span><span class="theme-sub">${esc(sub)}</span></button>`;
  }).join('');

  function renderThemeButtons() {
    $('themeSeg').querySelectorAll('button[data-theme]').forEach(x => {
      const on = x.dataset.theme === state.theme;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
  }
  renderThemeButtons();

  $('themeSeg').addEventListener('click', e => {
    const b = e.target.closest('button[data-theme]');
    if (!b) return;
    const setup = themeSetup(b.dataset.theme, null, today);
    applyTheme(setup, true);
    state.calYear = setup.calYear;
    state.calMonth = setup.calMonth;
    renderStage();
  });

  // ----- しぼりこみ（一覧の表示だけを変える） -----
  const radios = (name, modes) => Object.keys(modes).map(k =>
    `<label><input type="radio" name="${name}" value="${k}"${k === 'all' ? ' checked' : ''}>${esc(modes[k])}</label>`).join('');
  $('fPosted').innerHTML = radios('fPosted', POSTED_MODES);
  $('fEvent').innerHTML = radios('fEvent', EVENT_MODES);
  $('fStatus').innerHTML = STATUS_KEYS.map(k =>
    `<label><input type="checkbox" name="fStatus" value="${k}" checked>${esc(STATUS_LABELS[k])}</label>`).join('');
  $('typeFilter').innerHTML = TYPE_ORDER.map(t =>
    `<label class="ty-${t}"><input type="checkbox" name="fType" value="${t}" checked><span class="dot"></span>${esc(typeLabel(t))}</label>`).join('');

  // よく使うので、広い画面では開いた状態で始める（スマホは一覧を見やすくするため閉じておく）
  if (window.matchMedia && window.matchMedia('(min-width: 961px)').matches) $('filtersBox').open = true;

  $('filtersBody').addEventListener('change', e => {
    const el = e.target;
    const f = state.filters;
    if (el.name === 'fPosted') {
      f.posted = el.value;
      $('fPostedCustom').hidden = el.value !== 'custom';
    } else if (el.name === 'fEvent') {
      f.event = el.value;
      $('fEventCustom').hidden = el.value !== 'custom';
    } else if (el.name === 'fStatus' || el.name === 'fType') {
      const set = el.name === 'fStatus' ? f.status : f.types;
      if (el.checked) set.add(el.value);
      else set.delete(el.value);
    } else if (el.id === 'fPostedFrom' || el.id === 'fPostedTo') {
      f.postedCustom = {from: parseYMD($('fPostedFrom').value), to: parseYMD($('fPostedTo').value)};
    } else if (el.id === 'fEventFrom' || el.id === 'fEventTo') {
      f.eventCustom = {from: parseYMD($('fEventFrom').value), to: parseYMD($('fEventTo').value)};
    } else {
      return;
    }
    refreshList();
  });

  // ----- 候補一覧の検索・並び替え・「えらんだ予定だけ」（表示だけを変える） -----
  const searchEl = $('candSearch');
  const sortEl = $('candSort');
  const onlyEl = $('candOnly');
  // ブラウザが再読み込みで入力欄の値を復元することがあるので、画面の値を state の初期値にする
  state.sort = ['new', 'old', 'soon'].includes(sortEl.value) ? sortEl.value : 'new';
  state.filters.onlyChecked = !!onlyEl.checked;
  state.filters.query = searchEl.value || '';
  function refreshList() {
    renderCandList();
    candsEl.scrollTop = 0;
  }
  sortEl.addEventListener('change', () => {
    state.sort = sortEl.value;
    refreshList();
  });
  onlyEl.addEventListener('change', () => {
    state.filters.onlyChecked = onlyEl.checked;
    refreshList();
  });
  // 日本語の変換中（compositionstart〜end）は絞り込みを保留し、確定してから反映する
  let composing = false;
  function applyQuery() {
    if (state.filters.query === searchEl.value) return;
    state.filters.query = searchEl.value;
    refreshList();
  }
  searchEl.addEventListener('compositionstart', () => { composing = true; });
  searchEl.addEventListener('compositionend', () => {
    composing = false;
    applyQuery();
  });
  searchEl.addEventListener('input', e => {
    if (composing || e.isComposing) return;
    applyQuery();
  });
  // 変換の終わりの通知が来ないままフォーカスが外れても、検索が止まったままにならないようにする
  searchEl.addEventListener('blur', () => {
    composing = false;
    applyQuery();
  });
  // Enter で何かを送信することはしない（変換の確定の Enter は邪魔しない）
  searchEl.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !(e.isComposing || composing || e.keyCode === 229)) e.preventDefault();
  });

  // 「しぼりこみを解除」: 告知日・状況・開催日・種類・キーワード・「えらんだ予定だけ」を既定にもどす（チェックと並び順は変えない）
  $('filterReset').addEventListener('click', () => {
    state.filters = defaultFilters();
    $('filtersBody').querySelectorAll('input[type="radio"]').forEach(x => { x.checked = x.value === 'all'; });
    $('filtersBody').querySelectorAll('input[type="checkbox"]').forEach(x => { x.checked = true; });
    ['fPostedFrom', 'fPostedTo', 'fEventFrom', 'fEventTo'].forEach(id => { $(id).value = ''; });
    $('fPostedCustom').hidden = true;
    $('fEventCustom').hidden = true;
    searchEl.value = '';
    onlyEl.checked = false;
    refreshList();
  });

  // ===== 書き出し =====
  function setStatus(msg, isErr) {
    statusEl.textContent = msg;
    statusEl.classList.toggle('err', !!isErr);
  }
  function setBusy(b) {
    makeBtn.disabled = b;
    $('actions').querySelectorAll('button').forEach(x => { x.disabled = b; });
  }

  function readAsDataUrl(blob) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(r.result);
      r.onerror = () => reject(r.error);
      r.readAsDataURL(blob);
    });
  }

  // 失敗した Promise はキャッシュから外し、次の書き出しで取り直す
  function cached(map, key, make) {
    if (!map.has(key)) {
      const p = make();
      map.set(key, p);
      p.catch(() => { if (map.get(key) === p) map.delete(key); });
    }
    return map.get(key);
  }

  // 応答が返ってこない通信で書き出しが止まらないよう、本文の読み込みまで含めて打ち切る
  function fetchWithTimeout(url, read, ms = 10000) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), ms);
    return fetch(url, {mode: 'cors', signal: ctl.signal})
      .then(res => {
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        return read(res);
      })
      .finally(() => clearTimeout(timer));
  }

  function withTimeout(promise, ms, message) {
    let timer;
    const limit = new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(message)), ms); });
    return Promise.race([promise, limit]).finally(() => clearTimeout(timer));
  }

  const fontFileCache = new Map();   // フォントファイルの URL → data URL
  const fontCssCache = new Map();    // 文字の集合 → 埋め込み用 CSS
  function fontFileDataUrl(url) {
    return cached(fontFileCache, url, () => fetchWithTimeout(url, res => res.blob())
      .then(readAsDataUrl));
  }

  // 画像に出てくる文字だけのフォント（数十 KB）を取り寄せ、url(...) を data URL に置き換えた CSS を作る
  function subsetFontCss(text) {
    const chars = fontChars(text);
    return cached(fontCssCache, chars, () => fetchWithTimeout(fontCssUrl(chars), res => res.text())
      .then(css => {
        const urls = cssUrls(css);
        if (!urls.length) throw new Error('フォントの URL が見つかりません');
        return Promise.all(urls.map(u => fontFileDataUrl(u).then(d => [u, d])))
          .then(pairs => replaceCssUrls(css, Object.fromEntries(pairs)));
      }));
  }

  // 取り寄せに失敗したときだけ、従来どおり読み込み済みの @font-face を全部埋め込む（約 4.4MB）
  let fullFontCssPromise = null;
  function fullFontCss() {
    if (!fullFontCssPromise) {
      fullFontCssPromise = document.fonts.ready
        .then(() => window.htmlToImage.getFontEmbedCSS(stage))
        .catch(err => { fullFontCssPromise = null; throw err; });
    }
    return fullFontCssPromise;
  }

  async function getFontCss() {
    try {
      return await subsetFontCss(stage.textContent);
    } catch (err) {
      console.warn('文字を絞ったフォントを取得できなかったため、全体の埋め込みに切り替えます', err);
    }
    try {
      return await withTimeout(fullFontCss(), 20000, 'フォントの取得に時間がかかりすぎました');
    } catch (err) {
      // それも駄目なら、フォントを埋め込まずに（端末の標準フォントで）書き出す
      console.warn('フォントを埋め込まずに書き出します', err);
      return null;
    }
  }

  // 応答が返ってこない画像で書き出しが止まらないよう、最大 8 秒で打ち切る
  function waitStageImages(timeoutMs = 8000) {
    const imgs = Array.from(stage.querySelectorAll('img'));
    const all = Promise.all(imgs.map(img => img.complete ? null : new Promise(res => {
      img.addEventListener('load', res, {once: true});
      img.addEventListener('error', res, {once: true});
    })));
    return Promise.race([all, new Promise(res => setTimeout(res, timeoutMs))]);
  }

  // 書き出しの準備。待っている間に内容が変わったら（画像・文字が変わるので）最初からやり直す
  // 戻り値の version は、準備した時点の内容の版
  async function exportOptions() {
    if (!window.htmlToImage) throw new Error('画像をつくる機能（html-to-image）を読み込めませんでした');
    for (;;) {
      if (stageTimer) renderStage();   // 入力の反映待ち（150ms）が残っていれば先に反映する
      const v = state.version;
      await document.fonts.ready;
      await waitStageImages();
      sweepBrokenImages(true);
      await new Promise(res => requestAnimationFrame(() => res()));
      const fontEmbedCSS = await getFontCss();
      const opts = fontEmbedCSS ? {pixelRatio: 2, fontEmbedCSS} : {pixelRatio: 2, skipFonts: true};
      if (v === state.version && !stageTimer) return {opts, version: v};
    }
  }

  function fileName() {
    return `hakababunko-${state.kind}-${ymdCompact(new Date())}.png`;
  }

  const errText = err => (err && err.message ? err.message : String(err));

  // ----- できあがった画像 -----
  // 2 段階方式: 「画像をつくる」で先に PNG（Blob）を用意し、保存・コピー・共有はその Blob をクリック直後に同期で渡す。
  // 書き出しを待ってから share() を呼ぶとユーザー操作の有効期限が切れて NotAllowedError になるため
  function clearResult() {
    if (!state.result) return;
    URL.revokeObjectURL(state.result.url);
    state.result = null;
    resultImg.removeAttribute('src');
    resultEl.hidden = true;
  }

  function showResult(blob) {
    clearResult();
    const name = fileName();
    let file = null;
    try { file = new File([blob], name, {type: 'image/png'}); } catch (e) { file = null; }
    state.result = {blob, file, name, url: URL.createObjectURL(blob)};
    resultImg.src = state.result.url;   // 長押しで保存できるようにページ上にも出す
    resultEl.hidden = false;
  }

  // 環境が対応しているボタンだけを置く
  $('actions').innerHTML = [
    '<button type="button" class="btn" id="saveBtn">画像を保存</button>',
    canCopy ? '<button type="button" class="btn" id="copyBtn">画像をコピー</button>' : '',
    canShareFiles ? '<button type="button" class="btn primary" id="shareBtn">X などでシェア</button>' : ''
  ].join('');

  makeBtn.addEventListener('click', async () => {
    setBusy(true);
    setStatus('画像をつくっています。少しお待ちください…');
    try {
      const {opts, version: v} = await exportOptions();
      const tooLong = '時間がかかりすぎたので中断しました。もう一度お試しください';
      if (IS_WEBKIT) {
        for (let i = 0; i < WEBKIT_WARMUP; i++) await withTimeout(window.htmlToImage.toCanvas(stage, opts), 30000, tooLong);
      }
      const blob = await withTimeout(window.htmlToImage.toBlob(stage, opts), 30000, tooLong);
      if (!blob) throw new Error('画像を作れませんでした');
      if (v !== state.version || stageTimer) {
        setStatus('つくっている間に内容が変わりました。もう一度「画像をつくる」を押してください。', true);
        return;
      }
      showResult(blob);
      setStatus(canShareFiles ? '画像ができました。保存するか、X などでシェアしてください。' : '画像ができました。保存してから、X の投稿に添付してください。');
    } catch (err) {
      console.error(err);
      setStatus(`画像をつくれませんでした。少し時間をおいて、もう一度お試しください。（くわしく：${errText(err)}）`, true);
    } finally {
      setBusy(false);
    }
  });

  // PNG の保存は data URL ではなく Blob URL で（iOS Safari 対策）。使い終わったら revoke する
  $('saveBtn').addEventListener('click', () => {
    if (!state.result) return;
    const url = URL.createObjectURL(state.result.blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = state.result.name;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);   // すぐ revoke すると Safari でダウンロードが始まらないことがある
    setStatus('画像を保存しました。見つからないときは、下の画像を長押しして保存してください。');
  });

  if (canCopy) {
    $('copyBtn').addEventListener('click', () => {
      if (!state.result) return;
      navigator.clipboard.write([new ClipboardItem({'image/png': state.result.blob})])
        .then(() => setStatus('画像をコピーしました。X の投稿画面に貼りつけられます。'))
        .catch(err => {
          console.error(err);
          setStatus('コピーできませんでした。「画像を保存」をお使いください。', true);
        });
    });
  }

  if (canShareFiles) {
    $('shareBtn').addEventListener('click', () => {
      const file = state.result && state.result.file;
      if (!file || !navigator.canShare({files: [file]})) {
        setStatus('この環境ではシェアできませんでした。画像を保存してから、X の投稿に添付してください。', true);
        return;
      }
      navigator.share({files: [file]})
        .then(() => setStatus(''))
        .catch(err => {
          if (err && err.name === 'AbortError') { setStatus(''); return; }   // 共有シートを閉じただけ
          console.error(err);
          setStatus(`シェアできませんでした。画像を保存してから、X の投稿に添付してください。（くわしく：${errText(err)}）`, true);
        });
    });
  }

  // ===== 起動 =====
  if (!window.htmlToImage) setStatus('画像をつくる機能を読み込めませんでした。少し時間をおいて、ページを開き直してください。', true);

  fetch('data.json', {cache: 'no-store'})
    .then(res => {
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    })
    .then(json => {
      state.data = (Array.isArray(json) ? json : []).map((r, i) => Object.assign({}, r, {_i: i}));
      // 候補は公開中の全行で、ここで 1 回だけ作る（しぼりこみ・テーマでは作り直さない）
      state.cands = buildCandidates(state.data);
      renderCandList();
      renderStage();
      // 今の画像に出ている文字のフォントだけを裏で先に取り寄せておく（失敗しても全体の埋め込みには切り替えない）
      if (window.htmlToImage) setTimeout(() => { subsetFontCss(stage.textContent).catch(() => {}); }, 800);
    })
    .catch(err => {
      console.error(err);
      candsEl.innerHTML = '<p class="empty-note">予定を読み込めませんでした。少し時間をおいて、ページを開き直してください。</p>';
      renderStage();
    });
})();
</script>
</body>
</html>
